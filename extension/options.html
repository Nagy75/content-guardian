<!doctype html>
<html><head><meta charset="utf-8"><title>Content Guardian settings</title></head>
<body>
<h1>Content Guardian settings</h1>
<label>Blocked words, one per line<br><textarea id="words" rows="10" cols="40"></textarea></label><br>
<label>Replacement <input id="replacement" value="####"></label><br>
<label>Skip intervals, one per line (`HH:MM:SS-HH:MM:SS`)<br><textarea id="intervals" rows="6" cols="40"></textarea></label><br>
<button id="save">Save</button><span id="saved"></span><script src="options.js"></script>
</body></html>
